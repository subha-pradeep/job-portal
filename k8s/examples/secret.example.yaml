# Copy to k8s/01-secret.yaml, fill in real values, then apply the k8s folder.
# 01-secret.yaml is in .gitignore: never commit real secrets.
#
#   cp k8s/examples/secret.example.yaml k8s/01-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: jobportal-secrets
  namespace: jobportal
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me-root
  DB_PASSWORD: change-me
  JWT_SECRET: paste-output-of-openssl-rand-base64-48
  GEMINI_API_KEY: your-gemini-api-key
