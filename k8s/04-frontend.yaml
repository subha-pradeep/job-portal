apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jobportal
spec:
  replicas: 2              # stateless, so it can scale freely
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/subha-pradeep/job-portal-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
# NodePort: open http://localhost:30080 on Docker Desktop Kubernetes
# (on minikube: minikube service frontend -n jobportal)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: jobportal
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
