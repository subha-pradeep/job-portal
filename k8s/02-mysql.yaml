# MySQL as a StatefulSet: a stable name and its own persistent disk
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: jobportal
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: jobportal
            - name: MYSQL_USER
              value: jobportal
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: jobportal-secrets, key: DB_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: jobportal-secrets, key: MYSQL_ROOT_PASSWORD }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: jobportal
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
