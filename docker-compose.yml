# Starts a local MySQL database for development: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: jobportal-mysql
    environment:
      MYSQL_DATABASE: jobportal
      MYSQL_USER: jobportal
      MYSQL_PASSWORD: jobportal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
