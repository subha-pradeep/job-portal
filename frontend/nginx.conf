server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resumes can be up to 5 MB
    client_max_body_size 6m;

    # API calls go to the Spring Boot container/service named "backend".
    # Same origin for the browser, so no CORS problems.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    # React Router: unknown paths load index.html, and React shows the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
