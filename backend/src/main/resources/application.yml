spring:
  application:
    name: job-portal
  datasource:
    # Values come from environment variables; the defaults match docker-compose.yml
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobportal}
    username: ${DB_USER:jobportal}
    password: ${DB_PASSWORD:jobportal}
  jpa:
    hibernate:
      ddl-auto: update   # creates/updates tables from the entity classes
    show-sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB      # largest resume we accept
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health   # only expose the health check
  endpoint:
    health:
      probes:
        enabled: true     # adds /actuator/health/liveness and /readiness for Kubernetes

jwt:
  # Development-only default. In production set the JWT_SECRET environment variable
  # (generate one with: openssl rand -base64 48)
  secret: ${JWT_SECRET:mI38AICHusP+fo7MgwiDd7BDu53ZXxgRWtsNT7GnCEwzfXjOp3BXFkuGFuF3GHIR}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

app:
  # React dev server is allowed to call the API
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  # Folder where resume PDFs are saved (a Docker volume in docker-compose and Kubernetes)
  upload-dir: ${UPLOAD_DIR:uploads}

ai:
  gemini:
    # Get a free key at https://aistudio.google.com/apikey and set GEMINI_API_KEY.
    # Never commit the key. Without it, applications still work but aren't scored.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
